version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "good first issue"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch updates — bundled together, they do not need to be reviewed one by one
      minor-patch:
        update-types:
          - minor
          - patch
      # Major updates — separate PRs, they have to be read
      major:
        update-types:
          - major
    ignore:
      # electron-builder pulls in a lot of transitive packages — their updates create noise
      - dependency-name: "@xmcl/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Moscow
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
