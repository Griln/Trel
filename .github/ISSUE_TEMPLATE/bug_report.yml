name: Bug report
description: Что-то сломалось
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опиши проблему своими словами
      placeholder: При запуске версии 1.20.1 лаунчер зависает на скачивании библиотек
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Шаги, чтобы повторить баг
      placeholder: |
        1. Открыть «Каталог»
        2. Выбрать версию 1.20.1
        3. Нажать «Играть»
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
      placeholder: Лаунчер скачивает версию и запускает игру
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: |
        В приложении: Настройки → Диагностика → «Скопировать отчёт».
        Или прикрепи лог из `%APPDATA%\Trel\logs` (Windows) / `~/.config/Trel/logs` (Linux).
      render: shell

  - type: input
    id: trel-version
    attributes:
      label: Версия Trel
      placeholder: "0.5.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - Windows 11
        - Windows 10
        - Linux (дистрибутив укажи в комментарии)
        - macOS
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Версия Java
      placeholder: "17.0.11"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Что-то ещё
      description: Скриншоты, шаги, мысли
