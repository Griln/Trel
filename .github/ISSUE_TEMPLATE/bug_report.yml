name: Bug report
description: Something is broken
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in your own words
      placeholder: When starting version 1.20.1 the launcher hangs while downloading the libraries
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps to reproduce the bug
      placeholder: |
        1. Open the Catalog
        2. Pick version 1.20.1
        3. Hit Play
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The launcher downloads the version and starts the game
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        In the app: Settings → Diagnostics → "Copy report".
        Or attach the log from `%APPDATA%\Trel\logs` (Windows) or `~/.config/Trel/logs` (Linux).
      render: shell

  - type: input
    id: trel-version
    attributes:
      label: Trel version
      placeholder: "0.5.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (mention the distribution in a comment)
        - macOS
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "17.0.11"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, steps, thoughts
