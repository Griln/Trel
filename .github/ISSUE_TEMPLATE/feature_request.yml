name: Feature request
description: I would like the launcher to do something new
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation where you are missing a capability
      placeholder: Right now I cannot keep two builds with different memory settings at the same time
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: How you imagine the solution working
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you have tried instead of this

  - type: dropdown
    id: area
    attributes:
      label: Launcher section
      options:
        - Version catalog
        - Mods and modpacks
        - Skins
        - Worlds and servers
        - Import
        - Bedrock / TrelEmu
        - Settings
        - Interface
        - Other
    validations:
      required: false
