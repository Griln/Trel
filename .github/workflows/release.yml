name: Release

# Публикует релиз автоматически при пуше тега вида vX.Y.Z.
# Собирает Windows (инсталлятор NSIS и портативная сборка) и Linux (AppImage, deb, rpm),
# прикрепляет всё к релизу на GitHub.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза (например vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Сборка под Windows
    runs-on: windows-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Фиксация версии npm
        run: npm install -g npm@10

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка иконки
        run: npm run icon

      - name: Сборка интерфейса и основного процесса
        run: npm run build

      - name: Упаковка (NSIS + портативная сборка)
        run: npx electron-builder --win --publish never

      - name: Сбор артефактов
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          # Только верхний уровень папки release/: в подпапке win-unpacked лежат
          # adb.exe и elevate.exe из resources/platform-tools — они уже внутри
          # инсталлятора, в релиз не нужны.
          Get-ChildItem -Path 'release\*' -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' -and $_.Name -notin 'adb.exe', 'elevate.exe' } |
            Copy-Item -Destination dist-artifacts -Force
          Get-ChildItem dist-artifacts | Select-Object Name, Length

      - name: Выгрузка артефактов
        uses: actions/upload-artifact@v7
        with:
          name: windows
          retention-days: 7
          path: dist-artifacts/

  build-linux:
    name: Сборка под Linux
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Фиксация версии npm
        run: npm install -g npm@10

      - name: Установка зависимостей
        run: npm ci

      - name: Установка инструментов сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Сборка иконки
        run: npm run icon

      - name: Сборка интерфейса и основного процесса
        run: npm run build

      - name: Упаковка (AppImage + deb)
        run: npx electron-builder --linux --publish never

      - name: Упаковка rpm
        run: bash scripts/build-rpm-manual.sh

      - name: Сбор артефактов
        run: |
          mkdir -p dist-artifacts
          cp release/*.AppImage release/*.deb release/*.rpm release/latest-linux.yml dist-artifacts/ 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Выгрузка артефактов
        uses: actions/upload-artifact@v7
        with:
          name: linux
          retention-days: 7
          path: dist-artifacts/

  publish:
    name: Публикация релиза
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Определение тега
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Извлечение списка изменений
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          try:
              text = open('RELEASE_NOTES.md', encoding='utf-8').read()
          except FileNotFoundError:
              text = ''
          m = re.search(r'^#\s*Trel\s+v' + re.escape(version) + r'\b[\s\S]*?(?=^#\s|\Z)', text, re.M)
          print(m.group(0).strip() if m else f'## Trel v{version}\n\nСписок изменений — в файле RELEASE_NOTES.md.')
          PY
          cat release-notes.md

      - name: Загрузка артефактов
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Создание релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Trel ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/latest.yml
            artifacts/latest-linux.yml
          fail_on_unmatched_files: false
