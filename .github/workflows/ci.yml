name: CI

# Проверяем, что проект собирается, типы в порядке и тесты проходят.
# Релизы публикуются отдельным workflow — см. release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверки (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Фиксация версии npm
        run: npm install -g npm@10

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Тесты
        run: npx vitest run

      - name: Сборка интерфейса
        run: npm run build:renderer

  build:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Фиксация версии npm
        run: npm install -g npm@10

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка иконки
        run: npm run icon

      - name: Сборка интерфейса и основного процесса
        run: npm run build

      - name: Выгрузка результатов сборки
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/
            dist-electron/

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Фиксация версии npm
        run: npm install -g npm@10

      - name: Установка зависимостей
        run: npm ci

      - name: Аудит зависимостей (npm)
        run: npm audit --audit-level=high || true

      - name: Выгрузка отчёта аудита
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Сохранение отчёта аудита
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          retention-days: 14
          path: audit-report.json
